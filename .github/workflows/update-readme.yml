name: Update README Activity

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 10

      - name: Validate README Markers
        run: |
          if ! grep -q "<!-- RECENT_ACTIVITY:START -->" README.md || ! grep -q "<!-- RECENT_ACTIVITY:END -->" README.md; then
            echo "::error::README markers are missing!"
            exit 1
          fi

      - name: Generate Activity Section
        env:
          START_MARKER: "<!-- RECENT_ACTIVITY:START -->"
          END_MARKER: "<!-- RECENT_ACTIVITY:END -->"
        run: |
          RAW_LOGS=$(git log -5 --pretty=format:"- %ad \`%h\` %s" --date=short --invert-grep --grep="chore: update recent activity")
          export RAW_LOGS
          python3 -c '
          import os, re

          start = os.environ["START_MARKER"]
          end = os.environ["END_MARKER"]
          logs = os.environ.get("RAW_LOGS", "")

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          replacement = f"{start}\n{logs}\n{end}"
          pattern = re.escape(start) + r".*?" + re.escape(end)
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes detected in README."
          else
            git commit -m "chore: update recent activity [skip ci]"
            git push
          fi
